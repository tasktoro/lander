<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasktoro</title>
<style>
  :root {
    color-scheme: light dark;

    --bg:        #f5f5f7;
    --bg-2:      #ececef;
    --glow:      rgba(120, 145, 255, 0.28);
    --ink:       #1d1d1f;
    --ink-muted: #6e6e73;
    --dot:       #34c759;
    --hairline:  rgba(0, 0, 0, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #000000;
      --bg-2:      #0c0c0f;
      --glow:      rgba(94, 122, 255, 0.30);
      --ink:       #f5f5f7;
      --ink-muted: #98989d;
      --dot:       #30d158;
      --hairline:  rgba(255, 255, 255, 0.10);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    overflow: hidden;
    padding: 6vmin;
  }

  .glow {
    position: fixed;
    inset: -20% 0 auto 0;
    height: 70vmin;
    background: radial-gradient(closest-side, var(--glow), transparent 70%);
    filter: blur(30px);
    opacity: 0.9;
    pointer-events: none;
    animation: breathe 14s ease-in-out infinite;
    will-change: transform, opacity;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1);      opacity: 0.75; }
    50%      { transform: translateY(2.5%) scale(1.06); opacity: 1;    }
  }

  main {
    position: relative;
    text-align: center;
    max-width: 42rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    font-size: clamp(0.75rem, 1.5vw, 0.8125rem);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0.4em 0.9em;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
  }

  .status .dot {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 0 0 var(--dot);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0   color-mix(in srgb, var(--dot) 55%, transparent); }
    70%  { box-shadow: 0 0 0 6px color-mix(in srgb, var(--dot) 0%,  transparent); }
    100% { box-shadow: 0 0 0 0   color-mix(in srgb, var(--dot) 0%,  transparent); }
  }

  .name {
    font-size: clamp(2.75rem, 11vw, 6rem);
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.03em;
    font-optical-sizing: auto;
    color: var(--ink);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.16s forwards;
  }

  .subtitle {
    margin-top: clamp(0.75rem, 2.5vw, 1.25rem);
    font-size: clamp(1rem, 2.6vw, 1.375rem);
    font-weight: 400;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--ink-muted);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .status .dot { animation: none; }
    .status, .name, .subtitle {
      transform: none;
      animation: fade 0.4s ease forwards;
    }
    .name     { animation-delay: 0.1s; }
    .subtitle { animation-delay: 0.2s; }
    @keyframes fade { to { opacity: 1; } }
  }

  @media (prefers-reduced-transparency: reduce) {
    .glow { opacity: 0.35; filter: none; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <h1 class="name" id="site-name">Website</h1>
  </main>

  <script>
    const SITE_NAME = "Tasktoro";

    document.getElementById("site-name").textContent = SITE_NAME;
  </script>
</body>
</html>
